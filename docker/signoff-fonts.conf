<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- 會簽表 Template 用 Microsoft 字型名；Linux 對應 AR PL / Carlito 以接近 Word 版面 -->
<fontconfig>
  <alias binding="strong">
    <family>新細明體</family>
    <prefer><family>AR PL UMing TW</family></prefer>
  </alias>
  <alias binding="strong">
    <family>PMingLiU</family>
    <prefer><family>AR PL UMing TW</family></prefer>
  </alias>
  <alias binding="strong">
    <family>SimSun</family>
    <prefer><family>AR PL UMing CN</family></prefer>
  </alias>
  <alias binding="strong">
    <family>宋体</family>
    <prefer><family>AR PL UMing CN</family></prefer>
  </alias>
  <alias binding="strong">
    <family>標楷體</family>
    <prefer><family>AR PL UKai TW</family></prefer>
  </alias>
  <alias binding="strong">
    <family>标楷体</family>
    <prefer><family>AR PL UKai TW</family></prefer>
  </alias>
  <alias binding="strong">
    <family>DFKai-SB</family>
    <prefer><family>AR PL UKai TW</family></prefer>
  </alias>
  <alias binding="strong">
    <family>Arial</family>
    <prefer><family>Carlito</family></prefer>
  </alias>
  <alias binding="strong">
    <family>Calibri</family>
    <prefer><family>Carlito</family></prefer>
  </alias>
  <alias binding="strong">
    <family>Times New Roman</family>
    <prefer><family>Caladea</family></prefer>
  </alias>
</fontconfig>
