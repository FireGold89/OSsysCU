<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登入 — QS付款管理系統</title>
  <script>
    (function () {
      var saved = localStorage.getItem('qs_theme');
      var theme = saved === 'light' || saved === 'dark' ? saved
        : (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
  <link rel="stylesheet" href="css/style.css?v=20260815g">
  <link rel="stylesheet" href="css/vault-login.css?v=20260827a">
  <style>
    body.login-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .login-card {
      width: 100%;
      max-width: 380px;
      background: rgba(22, 27, 34, 0.92);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 28px 24px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
    }
    [data-theme="light"] .login-card {
      background: rgba(255, 255, 255, 0.94);
      border-color: rgba(0, 0, 0, 0.08);
    }
    .login-logo {
      text-align: center;
      margin-bottom: 20px;
    }
    .login-logo h1 {
      font-size: 20px;
      margin: 0 0 4px;
      color: var(--text-primary);
    }
    .login-logo p {
      margin: 0;
      font-size: 13px;
      color: var(--text-secondary);
    }
    .login-error {
      display: none;
      margin-bottom: 16px;
      padding: 10px 12px;
      border-radius: 8px;
      background: rgba(239, 68, 68, 0.12);
      color: var(--danger, #ef4444);
      font-size: 13px;
    }
    .login-error.show { display: block; }
    .login-submit { width: 100%; margin-top: 8px; }
    .login-foot {
      margin-top: 16px;
      text-align: center;
      font-size: 12px;
      color: var(--text-muted);
    }
  </style>
</head>
<body class="login-page">
  <div class="vault-scene" aria-hidden="true">
    <div class="vault-room-bg"></div>
    <div class="vault-frame">
      <div class="vault-glow"></div>
      <div class="vault-door vault-door--left"></div>
      <div class="vault-door vault-door--right"></div>
      <div class="vault-wheel">
        <span class="vault-wheel-spoke"></span>
        <span class="vault-wheel-spoke"></span>
        <span class="vault-wheel-spoke"></span>
      </div>
    </div>
  </div>

  <div class="login-card">
    <div class="login-logo">
      <div class="logo-icon">🔐</div>
      <h1>QS付款管理</h1>
      <p>Mepork Engineering</p>
    </div>
    <div class="login-error" id="loginError"></div>
    <form id="loginForm" autocomplete="on">
      <div class="form-group">
        <label class="form-label" for="loginUser">帳號</label>
        <input type="text" class="form-input" id="loginUser" name="username"
          autocomplete="username" required autofocus placeholder="admin 或 qs">
      </div>
      <div class="form-group">
        <label class="form-label" for="loginPass">密碼</label>
        <input type="password" class="form-input" id="loginPass" name="password"
          autocomplete="current-password" required placeholder="請輸入密碼">
      </div>
      <button type="submit" class="btn btn-primary login-submit" id="loginBtn">登入</button>
    </form>
    <div class="login-foot">內部系統 · 請使用公司配發帳號</div>
  </div>
  <script>
    const API = `${window.location.origin}/api`;
    const params = new URLSearchParams(window.location.search);
    const nextUrl = params.get('next') || '/';
    const VAULT_MS = 900;

    function playVaultOpen(onDone) {
      const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      document.body.classList.add('vault-opening');
      sessionStorage.setItem('qs_vault_enter', '1');
      setTimeout(onDone, reduced ? 200 : VAULT_MS);
    }

    async function checkAlreadyIn() {
      try {
        const r = await fetch(API + '/auth/me', { credentials: 'include' });
        const json = await r.json();
        if (json.success && json.data?.user) {
          window.location.replace(nextUrl.startsWith('/') ? nextUrl : '/');
        }
        if (json.success && json.data?.auth_required === false) {
          window.location.replace('/');
        }
      } catch (e) {}
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errEl = document.getElementById('loginError');
      const btn = document.getElementById('loginBtn');
      errEl.classList.remove('show');
      btn.disabled = true;
      btn.textContent = '驗證中…';
      try {
        const r = await fetch(API + '/auth/login', {
          method: 'POST',
          credentials: 'include',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: document.getElementById('loginUser').value.trim(),
            password: document.getElementById('loginPass').value,
          }),
        });
        const json = await r.json();
        if (!json.success) {
          throw new Error(json.error || '登入失敗');
        }
        btn.textContent = '開啟金庫…';
        playVaultOpen(() => {
          window.location.replace(nextUrl.startsWith('/') ? nextUrl : '/');
        });
      } catch (err) {
        errEl.textContent = err.message || '登入失敗';
        errEl.classList.add('show');
        btn.disabled = false;
        btn.textContent = '登入';
      }
    });

    checkAlreadyIn();
  </script>
</body>
</html>
